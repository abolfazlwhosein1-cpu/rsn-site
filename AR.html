<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>وانیلا استاردو ولی AR</title>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --gold: #fdcb6e;
            --bg: #0a0a0f;
            --card: #12121f;
            --border: rgba(255,255,255,0.06);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #12121f, #0a0a0f);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            padding: 20px 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.15);
            margin-top: 6px;
        }

        .header .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            background: rgba(253,203,110,0.08);
            border: 1px solid rgba(253,203,110,0.1);
            color: var(--gold);
        }

        /* ===== Stats ===== */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stats .stat-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }

        .stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }

        .stats .stat-item .label {
            font-size: 10px;
            color: rgba(255,255,255,0.15);
        }

        /* ===== Search ===== */
        .search-box {
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-size: 15px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.1);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(108,92,231,0.05);
        }

        /* ===== Filters ===== */
        .filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            justify-content: center;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(108,92,231,0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== Item Grid ===== */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        /* ===== Item Card ===== */
        .item-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 8px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .item-card:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(108,92,231,0.15);
            transform: translateY(-2px);
        }

            font-size: 32px;
            margin-bottom: 4px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .item-card .name {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            margin: 4px 0 2px;
            line-height: 1.3;
            max-height: 32px;
            overflow: hidden;
        }

        .item-card .id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--gold);
            font-weight: 700;
            direction: ltr;
            background: rgba(253,203,110,0.05);
            padding: 2px 10px;
            border-radius: 8px;
            border: 1px solid rgba(253,203,110,0.05);
            margin: 3px 0;
        }

        .item-card .copy-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 3px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            width: 100%;
            margin-top: 4px;
        }

        .item-card .copy-btn:hover {
            background: #7c6df0;
        }

        .item-card .copy-btn.copied {
            background: #00b894;
        }

        /* ===== Category Header ===== */
        .category-header {
            grid-column: 1 / -1;
            padding: 12px 0 6px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-header .count {
            font-size: 12px;
            color: rgba(255,255,255,0.1);
            font-weight: 400;
        }

        /* ===== Footer ===== */

            color: rgba(255,255,255,0.03);
            font-size: 11px;
            border-top: 1px solid var(--border);

        }

        }

        /* ===== Toast ===== */
        .toast {

            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18,18,31,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;

            color: #fff;

            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 90%;
        }

        .toast.show {

            pointer-events: auto;
        }

                height: 40px;

            .item-card .name {

        }

            border-radius: 10px;
        }

</head>

<script>
    // ============================================
    // ذرات پس‌زمینه
    // ============================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 1.2;
            this.speedY = (Math.random() - 0.5) * 1.2;
            this.color = `hsl(${Math.random() * 60 + 220}, 70%, 60%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > W) this.speedX *= -1;
            if (this.y < 0 || this.y > H) this.speedY *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 6;
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============================================

    let currentFilter = 'all';
    let copyCounter = 0;

    // ============================================
    // رندر کردن آیتم‌ها
    // ============================================
    function renderItems() {
        const grid = document.getElementById('itemGrid');
        grid.innerHTML = '';

        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        let totalItems = 0;
        let categories = 0;

        Object.entries(itemData).forEach(([category, items]) => {
            if (currentFilter !== 'all' && category !== currentFilter) {
                return;
            }

            let filteredItems = items;
            if (query) {
                filteredItems = items.filter(item =>
                    item.name.toLowerCase().includes(query) ||
                    String(item.id).toLowerCase().includes(query)
                );
            }

            if (filteredItems.length === 0) return;

            categories++;
            totalItems += filteredItems.length;

            const header = document.createElement('div');
            header.className = 'category-header';
            header.innerHTML = `${category} <span class="count">(${filteredItems.length})</span>`;
            grid.appendChild(header);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                const icon = document.createElement('div');
                icon.className = 'icon';
                icon.textContent = item.icon || '🎁';

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = item.name;

                const id = document.createElement('div');
                id.className = 'id';
                id.textContent = `[${item.id}]`;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 کپی';
                copyBtn.onclick = function(e) {
                    e.stopPropagation();
                    copyToClipboard(`[${item.id}]`, copyBtn);
                };

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(id);
                card.appendChild(copyBtn);

                card.addEventListener('click', function() {
                    copyToClipboard(`[${item.id}]`, this.querySelector('.copy-btn'));
                });

                grid.appendChild(card);
            });
        });

        document.getElementById('totalItems').textContent = totalItems;
        document.getElementById('totalCategories').textContent = categories;
    }

    // ============================================
    // کپی به کلیپ‌بورد
    // ============================================
    function copyToClipboard(text, btn) {
        const textToCopy = text;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showCopied(btn);
            }).catch(() => {
                fallbackCopy(textToCopy, btn);
            });
        } else {
            fallbackCopy(textToCopy, btn);
        }
    }

    function fallbackCopy(text, btn) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showCopied(btn);
        } catch (err) {
            showToast('❌ کپی نشد!');
        }
        document.body.removeChild(textarea);
    }

    function showCopied(btn) {
        const originalText = btn.textContent;
        btn.textContent = '✅ کپی شد';
        btn.classList.add('copied');
        copyCounter++;
        document.getElementById('copyCount').textContent = copyCounter;

        setTimeout(() => {
            btn.textContent = originalText;
            btn.classList.remove('copied');
        }, 2000);
    }

    // ============================================
    // Toast
    // ============================================
    let toastTimeout = null;

    function showToast(message) {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toastMessage');

        msg.textContent = message;
        toast.classList.add('show');

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // ============================================
    // فیلترها
    // ============================================
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === filter) {
                btn.classList.add('active');
            }
        });
        renderItems();
    }

    function filterItems() {
        renderItems();
    }

    // ============================================
    // شروع
    // ============================================
    renderItems();
