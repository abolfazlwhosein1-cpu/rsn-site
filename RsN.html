// ذرات متحرک

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.color = `hsl(${Math.random() * 60 + 220}, 80%, 60%)`;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > W) this.speedX *= -1;
        if (this.y < 0 || this.y > H) this.speedY *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fill();
    }
}
for (let i = 0; i < 60; i++) particles.push(new Particle());

function animate() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

function showModTab(type, btn) {
    document.querySelectorAll('.mod-tabs button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    const content = document.getElementById('modContent');
    const steps = modData[type] || modData.pc;
    content.innerHTML = steps.map(s => `
        <div class="mod-step">
            <div class="step-num">مرحله ${s.step}</div>
            <div class="step-text">${s.text}</div>
        </div>
    `).join('');
}

function rollDice() {
    const num = Math.floor(Math.random() * 6) + 1;
    const challenges = [
        document.getElementById('dice1')?.value || 'چیزی تعیین نشده',
        document.getElementById('dice2')?.value || 'چیزی تعیین نشده',
        document.getElementById('dice3')?.value || 'چیزی تعیین نشده',
        document.getElementById('dice4')?.value || 'چیزی تعیین نشده',
        document.getElementById('dice5')?.value || 'چیزی تعیین نشده',
        document.getElementById('dice6')?.value || 'چیزی تعیین نشده'
    ];
    document.getElementById('diceResult').innerHTML = 
        `🎲 عدد تاس: <b>${num}</b><br>📌 چالش: ${challenges[num-1]}`;
}

function saveWeeklyPlan() {
    const days = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
    let plan = '';
    for(let i=0; i<7; i++) {
        const val = document.getElementById('plan'+i)?.value.trim() || 'خالی';
        plan += `${days[i]}: ${val}\n`;
    }
    localStorage.setItem('weeklyPlan', plan);
    document.getElementById('planResult').innerHTML = '✅ پلن هفتگی ذخیره شد!';
}

function resetWeeklyPlan() {
    for(let i=0; i<7; i++) {
        const el = document.getElementById('plan'+i);
        if (el) el.value = '';
    }
    localStorage.removeItem('weeklyPlan');
    document.getElementById('planResult').innerHTML = '🔄 پلن هفتگی ریست شد!';
}

function calcGoal() {
    const current = parseFloat(document.getElementById('currentMoney')?.value) || 0;
    const target = parseFloat(document.getElementById('targetMoney')?.value) || 0;
    if(target === 0) {
        document.getElementById('goalResult').innerHTML = '⚠️ لطفاً عدد هدف رو وارد کن!';
        return;
    }
    const remaining = target - current;
    const percent = current / target * 100;
    document.getElementById('goalResult').innerHTML = `
        📊 پیشرفت: ${percent.toFixed(1)}%<br>
        💰 مانده تا هدف: ${remaining.toLocaleString('fa')} تومان<br>
        🎯 هدف: ${target.toLocaleString('fa')} تومان
    `;
}

let botKnowledge = JSON.parse(localStorage.getItem('botKnowledge')) || {};

function learnBot() {
    const q = document.getElementById('learnQuestion')?.value.trim();
    const a = document.getElementById('learnAnswer')?.value.trim();
    if(!q || !a) { alert('هر دو فیلد رو پر کن!'); return; }
    botKnowledge[q] = a;
    localStorage.setItem('botKnowledge', JSON.stringify(botKnowledge));
    document.getElementById('botStatus').innerHTML = `🧠 پخمه بات یاد گرفت: «${q}» → «${a}»`;
    document.getElementById('learnQuestion').value = '';
    document.getElementById('learnAnswer').value = '';
}

function chatWithBot() {
    const input = document.getElementById('chatInput');
    const text = input?.value.trim();
    if(!text) return;
    if (input) input.value = '';
    
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML += `<div class="msg user">👤 ${text}</div>`;
    
    let response = 'نمی‌دونم چی بگم! بهم یاد بده.';
    for(let key in botKnowledge) {
        if(text.includes(key) || key.includes(text)) {
            response = botKnowledge[key];
            break;
        }
    }
    chatBox.innerHTML += `<div class="msg bot">🤖 ${response}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function resetBot() {
    botKnowledge = {};
    localStorage.removeItem('botKnowledge');
    document.getElementById('chatBox').innerHTML = '<div class="msg bot">🤖 سلام! من پخمه بات هستم. بهم یاد بده چطور جواب بدم.</div>';
    document.getElementById('botStatus').innerHTML = '🔄 پخمه بات ریست شد! دوباره بهش یاد بده.';
}

document.getElementById('chatInput')?.addEventListener('keydown', function(e) {
    if(e.key === 'Enter') chatWithBot();
});

function getLuck() {
    const today = new Date().toDateString();
    const lastLuck = localStorage.getItem('lastLuckDate');
    if(lastLuck === today) {
        const oldLuck = localStorage.getItem('luckResult');
        document.getElementById('luckResult').innerHTML = `⏳ امروز قبلاً شانس گرفتی!<br>🍀 شانس امروزت: ${oldLuck}`;
        return;
    }
    const luck = [
        '🌟 امروز روزت عالیه!', '💪 قوی و موفق باشی!', '❤️ محبت به دلت برسه!',
        '🎉 خبر خوبی میرسه!', '💰 پول و برکت میاد!', '😊 لبخندت رو حفظ کن!',
        '🔥 انرژی بالا داری!', '🌈 رنگین‌کمان امروز با توئه!', '⭐ ستاره‌ات میدرخشه!',
        '🍀 شانس با توئه!', '💎 ارزش خودت رو بدان!', '🚀 امروز پرواز کن!'
    ];
    const result = luck[Math.floor(Math.random() * luck.length)];
    localStorage.setItem('lastLuckDate', today);
    localStorage.setItem('luckResult', result);
    document.getElementById('luckResult').innerHTML = `🍀 ${result}`;
}

const savedPlan = localStorage.getItem('weeklyPlan');
if(savedPlan) {
    document.getElementById('planResult').innerHTML = '📋 پلن هفتگی ذخیره شده:\n' + savedPlan;
}
</script>
