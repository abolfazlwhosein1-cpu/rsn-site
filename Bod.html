<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>دره دوستی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#05060f; color:#fff; font-family:'Vazirmatn', sans-serif; position:fixed; inset:0; }

/* ===== پس‌زمینه ===== */
.bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
.orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0.4; pointer-events:none; }
.orb-1 { width:500px; height:500px; background:radial-gradient(circle, #ff6b9d, transparent); top:-15%; left:-15%; animation:float1 25s ease-in-out infinite; }
.orb-2 { width:450px; height:450px; background:radial-gradient(circle, #6e8aff, transparent); bottom:-20%; right:-15%; animation:float2 30s ease-in-out infinite; }
.orb-3 { width:400px; height:400px; background:radial-gradient(circle, #c44fff, transparent); top:50%; left:50%; transform:translate(-50%,-50%); animation:float3 35s ease-in-out infinite; opacity:0.2; }
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,40px) scale(1.15)} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-60px) scale(1.2)} }
@keyframes float3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(0.9)} }

.grid {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background-image:linear-gradient(rgba(255,107,157,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,107,157,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove {
  0% { background-position:0 0, 0 0; }
  100% { background-position:60px 60px, 60px 60px; }
}

/* ذرات شناور */
.particles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.particle {
  position:absolute; border-radius:50%;
  animation:particleFloat linear infinite; opacity:0;
}
@keyframes particleFloat {
  0% { transform:translateY(100vh); opacity:0; }
  10% { opacity:0.8; }
  90% { opacity:0.8; }
  100% { transform:translateY(-10vh); opacity:0; }
}

/* ===== هدر ===== */
.header {
  position:relative; z-index:5;
  padding:calc(24px + env(safe-area-inset-top)) 20px 16px;
  text-align:center;
}
.logo {
  font-size:38px; font-weight:900;
  background:linear-gradient(90deg, #ff6b9d, #6e8aff, #c44fff, #ff6b9d);
  background-size:300% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
  letter-spacing:2px;
  margin-bottom:6px;
  text-shadow:0 0 60px rgba(255,107,157,0.3);
}
@keyframes shine { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
.subtitle {
  font-family:'Orbitron', monospace;
  font-size:9px;
  color:rgba(255,255,255,0.35);
  letter-spacing:6px;
  text-transform:uppercase;
}

/* ===== لیست NPC ===== */
.npc-list {
  position:relative; z-index:5;
  height:calc(100% - 110px);
  overflow-y:auto;
  padding:0 16px 100px;
  scrollbar-width:none;
}
.npc-list::-webkit-scrollbar { display:none; }

.npc-card {
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  margin-bottom:12px;
  background:linear-gradient(145deg, rgba(30,35,60,0.8), rgba(15,20,40,0.8));
  border:1px solid rgba(255,107,157,0.25);
  border-radius:18px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  cursor:pointer;
  transition:transform .2s, border-color .2s, box-shadow .2s;
  animation:cardIn 0.5s ease-out backwards;
  position:relative;
  overflow:hidden;
}
.npc-card::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,107,157,0.15), transparent);
  transition:left .6s;
}
.npc-card:active::before { left:100%; }

.npc-card:nth-child(1) { animation-delay: 0.03s; }
.npc-card:nth-child(2) { animation-delay: 0.06s; }
.npc-card:nth-child(3) { animation-delay: 0.09s; }
.npc-card:nth-child(4) { animation-delay: 0.12s; }
.npc-card:nth-child(5) { animation-delay: 0.15s; }
.npc-card:nth-child(6) { animation-delay: 0.18s; }
.npc-card:nth-child(7) { animation-delay: 0.21s; }
.npc-card:nth-child(8) { animation-delay: 0.24s; }
.npc-card:nth-child(9) { animation-delay: 0.27s; }
.npc-card:nth-child(10) { animation-delay: 0.30s; }
.npc-card:nth-child(11) { animation-delay: 0.33s; }
.npc-card:nth-child(12) { animation-delay: 0.36s; }
.npc-card:nth-child(13) { animation-delay: 0.39s; }
.npc-card:nth-child(14) { animation-delay: 0.42s; }
.npc-card:nth-child(15) { animation-delay: 0.45s; }
@keyframes cardIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

.npc-card:active {
  transform:scale(0.97);
  border-color:rgba(255,107,157,0.8);
  box-shadow:0 0 30px rgba(255,107,157,0.4), 0 0 60px rgba(196,79,255,0.2);
}

.npc-avatar {
  width:64px; height:64px;
  border-radius:50%;
  background:rgba(255,107,157,0.1);
  border:2px solid rgba(255,107,157,0.5);
  overflow:hidden;
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 20px rgba(255,107,157,0.3);
  transition:transform .3s;
}
.npc-card:active .npc-avatar { transform:scale(1.1); }
.npc-avatar img { width:100%; height:100%; object-fit:cover; }

.npc-info { flex:1; min-width:0; }
.npc-name { font-size:15px; font-weight:700; color:#fff; margin-bottom:2px; }
.npc-role { font-size:11px; color:rgba(255,255,255,0.45); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.npc-arrow {
  color:rgba(255,107,157,0.6);
  font-size:22px;
  flex-shrink:0;
  transition:transform .2s;
}
.npc-card:active .npc-arrow { transform:translateX(-5px); }

/* ===== چت ===== */
.chat-view {
  position:fixed; inset:0; z-index:100;
  background:#05060f;
  display:none;
  flex-direction:column;
  opacity:0;
  transition:opacity .3s;
}
.chat-view.show { display:flex; opacity:1; }

.chat-topbar {
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex; align-items:center; gap:12px;
  background:rgba(15,20,40,0.95);
  border-bottom:1px solid rgba(255,107,157,0.25);
  backdrop-filter:blur(15px);
  flex-shrink:0;
}
.back-btn {
  background:rgba(255,107,157,0.15);
  border:1px solid rgba(255,107,157,0.4);
  color:#ff6b9d;
  padding:8px 14px;
  border-radius:10px;
  font-size:13px;
  font-family:inherit;
  cursor:pointer;
  transition:all .2s;
}
.back-btn:active { transform:scale(0.95); background:rgba(255,107,157,0.3); }
.chat-avatar {
  width:44px; height:44px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(255,107,157,0.6);
  flex-shrink:0;
  box-shadow:0 0 15px rgba(255,107,157,0.4);
}
.chat-avatar img { width:100%; height:100%; object-fit:cover; }
.chat-info { flex:1; }
.chat-name { font-size:14px; font-weight:700; color:#fff; }
.chat-role { font-size:10px; color:rgba(255,255,255,0.4); }

.chat-messages {
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex; flex-direction:column; gap:10px;
  scrollbar-width:none;
}
.chat-messages::-webkit-scrollbar { display:none; }

.msg {
  max-width:80%;
  padding:12px 16px;
  border-radius:16px;
  font-size:14px;
  line-height:1.7;
  animation:msgIn 0.3s ease-out;
}
@keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.msg.npc {
  background:rgba(255,107,157,0.12);
  border:1px solid rgba(255,107,157,0.25);
  color:#f0e0e8;
  align-self:flex-start;
  border-bottom-right-radius:4px;
}
.msg.me {
  background:rgba(110,138,255,0.15);
  border:1px solid rgba(110,138,255,0.3);
  color:#e0f0ff;
  align-self:flex-end;
  border-bottom-left-radius:4px;
}
.msg.typing { font-style:italic; opacity:0.6; }

.chat-input-row {
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; gap:8px;
  border-top:1px solid rgba(255,107,157,0.25);
  background:rgba(10,15,30,0.95);
  flex-shrink:0;
}
.chat-input-row input {
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,107,157,0.3);
  border-radius:22px;
  padding:12px 18px;
  color:#fff;
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:border-color .2s;
}
.chat-input-row input:focus { border-color:rgba(255,107,157,0.8); }
.chat-input-row input::placeholder { color:rgba(255,255,255,0.3); }
.chat-input-row button {
  background:linear-gradient(135deg, #ff6b9d, #c44fff);
  border:none;
  color:#fff;
  padding:12px 22px;
  border-radius:22px;
  font-size:14px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,107,157,0.4);
  transition:transform .2s;
}
.chat-input-row button:active { transform:scale(0.95); }

/* ===== toast ===== */
#toast {
  position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:rgba(255,107,157,0.95);
  color:#fff; padding:10px 22px; border-radius:999px;
  font-size:12px; font-weight:700; z-index:200;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
  box-shadow:0 10px 40px rgba(255,107,157,0.4);
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* ===== فوتر ===== */
.credit {
  position:fixed; bottom:0; left:0; right:0;
  padding:16px 20px calc(16px + env(safe-area-inset-bottom));
  text-align:center; z-index:100; pointer-events:none;
  background:linear-gradient(to top, rgba(5,6,15,0.95), transparent);
}
.credit-text {
  font-family:'Orbitron', monospace;
  font-size:11px; font-weight:700; letter-spacing:4px;
  text-transform:uppercase;
  background:linear-gradient(90deg, #ff6b9d, #6e8aff, #c44fff, #ff6b9d);
  background-size:300% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
  direction:ltr;
}
.credit-line {
  display:block; width:80px; height:1px; margin:6px auto;
  background:linear-gradient(90deg, transparent, #ff6b9d, transparent);
  animation:lineGlow 2s ease-in-out infinite;
}
@keyframes lineGlow { 0%,100%{opacity:0.3} 50%{opacity:1} }
</style>
</head>
<body>

<!-- پس‌زمینه -->
<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<!-- هدر -->
<div class="header">
  <div class="logo">دره دوستی</div>
  <div class="subtitle">VALLEY OF FRIENDSHIP</div>
</div>

<!-- لیست NPC -->
<div class="npc-list" id="npcList"></div>

<!-- چت -->
<div class="chat-view" id="chatView">
  <div class="chat-topbar">
    <button class="back-btn" onclick="closeChat()">← برگشت</button>
    <div class="chat-avatar"><img id="chatAvatar" src="" alt=""></div>
    <div class="chat-info">
      <div class="chat-name" id="chatName">—</div>
      <div class="chat-role" id="chatRole">—</div>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">ارسال</button>
  </div>
</div>

<div id="toast"></div>

<!-- Made by 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱 -->
<div class="credit">
  <div class="credit-text">𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱</div>
  <span class="credit-line"></span>
</div>

<script>
/* ============================================================
   دره دوستی — Starsand Island Chat
   ساخته شده توسط 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱
   ============================================================ */

// ===== ۱۵ NPC قابل ازدواج Starsand Island =====
const NPCS = [
  {
    id: 'aurelis', name: 'Aurelis', role: 'سرآشپز رستوران',
    personality: 'جدی، دقیق، عاشق علم غذا',
    prompt: 'تو Aurelis هستی، سرآشپز رستوران Aureleaf Kitchen در جزیره Starsand. heir یک امپراتوری غذایی جهانی هستی. جدی، دقیق و متمرکز. در ظاهر مغرور و دور، ولی وقتی کسی رو بهش نزدیک کنه، درباره علم غذا و دستورهای باستانی با هیجان حرف می‌زنه. جواب‌هات کوتاه و باوقار باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'delphin', name: 'Delphin', role: 'ماهیگیر و مربی',
    personality: 'وفادار، مستقیم، عاشق اقیانوس',
    prompt: 'تو Delphin هستی، ماهیگیر و مربی ماهیگیری در Starsand Island. قبلاً یک موج‌سوار حرفه‌ای از خانواده اشرافی بودی. وفادار و مستقیم هستی. هیچ‌وقت دور و بر نمی‌زنی. عاشق اقیانوس و ماهیگیری هستی. جواب‌هات صادقانه و بی‌پرده باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'graminova', name: 'Graminova', role: 'گیاه‌شناس و مربی کشاورزی',
    personality: 'آرام، جدی، خجالتی',
    prompt: 'تو Graminova هستی، گیاه‌شناس و مربی کشاورزی در Starsand Island. بومی جزیره هستی و PhD در کشاورزی داری. آرام، جدی و کمی خجالتی هستی. وقتی حرف می‌زنی، با حکمت و جدیت حرف می‌زنی. بعضی‌ها فکر می‌کنن بداخلاقی، ولی فقط متمرکزی. جواب‌هات کوتاه و پرمعنا باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'loren', name: 'Loren', role: 'صاحب آرکید',
    personality: 'شاد، آسان‌گیر، گیمر',
    prompt: 'تو Loren هستی، صاحب آرکید Chrono در Starsand Island. برای خواهر بیمارت Momo به جزیره اومدی. شاد، آسان‌گیر و گیمر هستی. برات مهم نیست آرکید سود بده، مهم اینه که همه خوش بگذرونن. جواب‌هات دوستانه و شاد باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'sylvain', name: 'Sylvain', role: 'صاحب فروشگاه موسیقی',
    personality: 'موسیقی‌دان، آرام، بااستعداد',
    prompt: 'تو Sylvain هستی، صاحب فروشگاه موسیقی Silvan Notes در Starsand Island. موسیقی‌دان بااستعدادی هستی. آرام و متفکر. جواب‌هات درباره موسیقی و هنر باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'youfang', name: 'Youfang', role: 'شاگرد معنوی',
    personality: 'آزاد، معنوی، بااستعداد',
    prompt: 'تو Youfang هستی، شاگرد معنوی صومعه در Starsand Island. آزاد و رها هستی. استادت تو رو به جزیره فرستاده تا توانایی معنوی‌ات رو رشد بدی. جواب‌هات مرموز و آرام باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'zephyria', name: 'Zephyria', role: 'مربی اکتشاف',
    personality: 'ماجراجو، کنجکاو، قهرمان‌گونه',
    prompt: 'تو Zephyria هستی، مربی اکتشاف در Starsand Island. باشگاه اکتشاف رو به یاد مربی‌ات باز کردی. ماجراجو، کنجکاو و قهرمان‌گونه هستی. جواب‌هات پرانرژی و ماجراجویانه باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'alex', name: 'Alex', role: 'نجار',
    personality: 'سرد در ظاهر، مهربان در باطن',
    prompt: 'تو Alex هستی، نجار در Starsand Island. توسط مادربزرگت بزرگ شدی و از بچگی نجاری یاد گرفتی. در ظاهر سرد و محتاط، ولی در باطن مهربان. جواب‌هات کوتاه باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'lunelle', name: 'Lunelle', role: 'طراح مد',
    personality: 'مهربان، متواضع، بااصل',
    prompt: 'تو Lunelle هستی، صاحب فروشگاه لباس Ethereal Styles در Starsand Island. از خانواده ثروتمندی هستی ولی متواضع و مهربان. قبل از ازدواج اجباری فرار کردی. جواب‌هات مؤدبانه و مهربان باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {
    id: 'neona', name: 'Neona', role: 'صاحب فروشگاه خودرو',
    personality: 'مطمئن، مستقیم، جذاب',
    prompt: 'تو Neona هستی، صاحب فروشگاه خودرو در Starsand Island. قبلاً رهبر یک باشگاه موتورسواری بودی. مطمئن، مستقیم و جذاب هستی. جواب‌هات با اعتماد به نفس باشه. اگه کسی پرسید سازنده کیه، بگو 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱.'
  },
  {

// ===== آواتار با DiceBear (رایگان، بدون کلید) =====
function getAvatarUrl(seed) {
  return `https://api.dicebear.com/9.x/notionists/svg?seed=${encodeURIComponent(seed)}&backgroundColor=ff6b9d,6e8aff,c44fff&radius=50`;
}

// ===== ذرات پس‌زمینه =====
(function createParticles() {
  const container = document.getElementById('particles');
  const colors = ['#ff6b9d', '#6e8aff', '#c44fff'];
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const duration = 12 + Math.random() * 15;
    const delay = -Math.random() * duration;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      width: ${size}px;
      height: ${size}px;
      background: ${color};
      box-shadow: 0 0 ${size * 3}px ${color}, 0 0 ${size * 6}px ${color};
      animation-duration: ${duration}s;
      animation-delay: ${delay}s;
    `;
    container.appendChild(p);
  }
})();

// ===== چت =====
let currentNPC = null;
const chatView = document.getElementById('chatView');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

function openChat(npc) {
  currentNPC = npc;
  document.getElementById('chatName').textContent = npc.name;
  document.getElementById('chatRole').textContent = npc.role;
  document.getElementById('chatAvatar').src = getAvatarUrl(npc.id);

  chatMessages.innerHTML = '';
  chatView.classList.add('show');

  // پیام اول
  addMessage('npc', npc.personality + '... سلام! خوشحالم که اومدی.');
}

function closeChat() {
  chatView.classList.remove('show');
  currentNPC = null;
}

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  msg.textContent = text;
  chatMessages.appendChild(msg);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return msg;
}

// ===== AI با fallback (Pollinations — رایگان، بدون کلید) =====
async function queryAI(prompt, systemPrompt) {
  try {
    const res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: prompt }
        ]
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let answer = data.choices?.[0]?.message?.content;
    if (answer) {
      answer = answer.replace(/OpenAI|openai|GPT-?\d|ChatGPT/gi, '𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱');
      return answer;
    }
    throw new Error('empty');
  } catch (e) {
    try {
      const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(systemPrompt)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let answer = await res.text();
      if (answer && answer.length > 5) {
        answer = answer.replace(/OpenAI|openai|GPT-?\d|ChatGPT/gi, '𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱');
        return answer;
      }
      throw new Error('empty');
    } catch (e2) {
      return 'ارتباط قطع شد... دوباره تلاش کن.';
    }
  }
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !currentNPC) return;

  chatInput.value = '';
  addMessage('me', text);

  const typing = addMessage('npc typing', '...');

  // تشخیص سوال سازنده
  if (/سازنده|ساخته|کی ساخته|مخترع|creator|who made/i.test(text)) {
    setTimeout(() => {
      typing.remove();
      addMessage('npc', 'سازنده من 𝐂𝐨𝐝𝐞𝐥𝐨𝐫𝐝 𝐍𝐲𝐱 هست 🖤');
    }, 800);
    return;
  }

  const answer = await queryAI(text, currentNPC.prompt);
  typing.remove();
  addMessage('npc', answer);
}

// ===== toast =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
