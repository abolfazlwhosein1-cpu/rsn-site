
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>راهنمای کامل نامه‌های استاردو ولی | RSN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --gold: #fdcb6e;
            --bg: #0a0a0f;
            --card: #12121f;
            --border: rgba(255,255,255,0.06);
            --paper: #f5e6c8;
            --ink: #2d1b0e;
            --seal: #c0392b;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #12121f, #0a0a0f);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            padding: 20px 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.15);
            margin-top: 6px;
        }

        .header .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            background: rgba(253,203,110,0.08);
            border: 1px solid rgba(253,203,110,0.1);
            color: var(--gold);
        }

        /* ===== Stats ===== */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stats .stat-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }

        .stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }

        .stats .stat-item .label {
            font-size: 10px;
            color: rgba(255,255,255,0.15);
        }

        /* ===== Search ===== */
        .search-box {
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-size: 15px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.1);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(108,92,231,0.05);
        }

        /* ===== Filters ===== */
        .filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            justify-content: center;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(108,92,231,0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== Letter Grid ===== */
        .letter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* ===== Letter Card ===== */
        .letter-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;

        .letter-card:hover {

            border-color: rgba(108,92,231,0.15);
        }

            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

            font-size: 28px;
        }

        .letter-card .letter-header .title-group {

        }

        .letter-card .letter-header .title-group .title {
            font-size: 16px;
            font-weight: 700;
        }

        }

        .letter-card .letter-header .tag {

            background: rgba(253,203,110,0.08);
            color: var(--gold);

        }

        .letter-card .letter-header .tag.island {
            background: rgba(0,206,201,0.08);
            color: var(--secondary);
            border-color: rgba(0,206,201,0.05);
        }

        /* ===== Letter Body ===== */
        .letter-card .letter-body {
            padding: 16px 18px;
        }

        .letter-card .letter-body .original {
            background: rgba(245,230,200,0.05);
            border-radius: 12px;
            padding: 14px 16px;
            border-right: 3px solid var(--gold);
            margin-bottom: 12px;
        }

        .letter-card .letter-body .original .label {
            font-size: 11px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }

        .letter-card .letter-body .original .text {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            line-height: 1.8;
            font-style: italic;
        }

        .letter-card .letter-body .translation {
            background: rgba(108,92,231,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            border-right: 3px solid var(--primary);
            margin-bottom: 12px;
        }

        .letter-card .letter-body .translation .label {
            font-size: 11px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }

        .letter-card .letter-body .translation .text {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            line-height: 1.8;
        }

        .letter-card .letter-body .solution {
            background: rgba(0,206,201,0.03);
            border-radius: 12px;
            padding: 14px 16px;
            border-right: 3px solid var(--secondary);
        }

        .letter-card .letter-body .solution .label {
            font-size: 11px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }

        .letter-card .letter-body .solution .text {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            line-height: 1.8;
        }

        .letter-card .letter-body .solution .text .highlight {
            color: var(--gold);
            font-weight: 700;
        }

        .letter-card .letter-body .solution .steps {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
        }

        .letter-card .letter-body .solution .steps li {
            padding: 4px 0 4px 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            line-height: 1.6;
            position: relative;
        }

        .letter-card .letter-body .solution .steps li::before {
            content: '▸';
            position: absolute;
            right: 0;
            color: var(--gold);
        }

        .letter-card .letter-footer {
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .letter-card .letter-footer .reward {
            color: var(--gold);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            color: rgba(255,255,255,0.03);
            font-size: 11px;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }

        .footer span {
            color: var(--primary);
            font-weight: 700;
        }

        .footer .heart {
            color: #f5576c;
        }

        /* ===== Responsive ===== */
        @media (max-width: 500px) {
            .header h1 {
                font-size: 24px;
            }
            .letter-card .letter-header .title-group .title {
                font-size: 14px;
            }
            .letter-card .letter-body .original .text,
            .letter-card .letter-body .translation .text,

                font-size: 13px;
            }
            .stats .stat-item {
                min-width: 70px;
                padding: 8px 14px;
            }
            .stats .stat-item .num {
                font-size: 18px;
            }
        }

        @media (max-width: 380px) {
            .letter-card .letter-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .letter-card .letter-header .tag {
                align-self: flex-start;
            }
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>

</div>

<script>
    // ============================================
    // ذرات پس‌زمینه
    // ============================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 1.2;
            this.speedY = (Math.random() - 0.5) * 1.2;
            this.color = `hsl(${Math.random() * 60 + 220}, 70%, 60%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > W) this.speedX *= -1;
            if (this.y < 0 || this.y > H) this.speedY *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 6;
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============================================
    // متغیرهای فیلتر
    // ============================================
    let currentFilter = 'all';

    // ============================================
    // رندر کردن نامه‌ها
    // ============================================
    function renderLetters() {
        const grid = document.getElementById('letterGrid');
        grid.innerHTML = '';

        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = [...letterData];

        // فیلتر بر اساس جستجو
        if (query) {
            filtered = filtered.filter(l =>
                l.title.toLowerCase().includes(query) ||
                l.translation.toLowerCase().includes(query) ||
                l.solution.toLowerCase().includes(query) ||
                l.location.toLowerCase().includes(query)
            );
        }

        // فیلتر بر اساس دکمه‌ها
        if (currentFilter === 'pelican') {
            filtered = filtered.filter(l => l.location === 'پلیکان');
        } else if (currentFilter === 'island') {
            filtered = filtered.filter(l => l.location === 'جزیره گردو');
        } else if (currentFilter === 'solved') {
            filtered = filtered.filter(l => l.solved === true);
        } else if (currentFilter === 'unsolved') {
            filtered = filtered.filter(l => l.solved === false);
        }

        // آمار
        document.getElementById('totalLetters').textContent = letterData.length;
        document.getElementById('pelicanLetters').textContent = letterData.filter(l => l.location === 'پلیکان').length;
        document.getElementById('islandLetters').textContent = letterData.filter(l => l.location === 'جزیره گردو').length;
        document.getElementById('solvedLetters').textContent = letterData.filter(l => l.solved).length;

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.05);grid-column:1/-1;">
                    <div style="font-size:48px;margin-bottom:12px;">🔍</div>
                    <div style="font-size:14px;">هیچ نامه‌ای با این جستجو پیدا نشد</div>
                </div>
            `;
            return;
        }

        filtered.forEach(letter => {
            const card = document.createElement('div');
            card.className = 'letter-card';

            // ===== Header =====
            const header = document.createElement('div');
            header.className = 'letter-header';

            const icon = document.createElement('span');
            icon.className = 'icon';
            icon.textContent = letter.icon;

            const titleGroup = document.createElement('div');
            titleGroup.className = 'title-group';

            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = letter.title;

            const location = document.createElement('div');
            location.className = 'location';
            location.textContent = `📍 ${letter.location}`;

            titleGroup.appendChild(title);
            titleGroup.appendChild(location);

            const tag = document.createElement('span');
            tag.className = `tag ${letter.location === 'جزیره گردو' ? 'island' : ''}`;
            tag.textContent = letter.location === 'جزیره گردو' ? '🏝️ جزیره گردو' : '🏘️ پلیکان';

            const statusTag = document.createElement('span');
            statusTag.className = 'tag';
            statusTag.style.cssText = letter.solved ? 
                'background:rgba(0,184,148,0.08);color:#00b894;border-color:rgba(0,184,148,0.05);' :
                'background:rgba(253,203,110,0.08);color:#fdcb6e;border-color:rgba(253,203,110,0.05);';
            statusTag.textContent = letter.solved ? '✅ حل شده' : '⏳ حل نشده';

            header.appendChild(icon);
            header.appendChild(titleGroup);
            header.appendChild(tag);
            header.appendChild(statusTag);

            card.appendChild(header);

            // ===== Body =====
            const body = document.createElement('div');
            body.className = 'letter-body';

            // Original
            const originalDiv = document.createElement('div');
            originalDiv.className = 'original';
            originalDiv.innerHTML = `
                <div class="label">📜 متن اصلی:</div>
                <div class="text">"${letter.original}"</div>
            `;
            body.appendChild(originalDiv);

            // Translation
            const translationDiv = document.createElement('div');
            translationDiv.className = 'translation';
            translationDiv.innerHTML = `
                <div class="label">🔄 ترجمه فارسی:</div>
                <div class="text">"${letter.translation}"</div>
            `;
            body.appendChild(translationDiv);

            // Solution
            const solutionDiv = document.createElement('div');
            solutionDiv.className = 'solution';
            
            let stepsHtml = '';
            if (letter.steps && letter.steps.length > 0) {
                stepsHtml = '<ul class="steps">';
                letter.steps.forEach(step => {
                    stepsHtml += `<li>${step}</li>`;
                });
                stepsHtml += '</ul>';
            }

            solutionDiv.innerHTML = `
                <div class="label">🎯 راه حل و آموزش:</div>
                <div class="text">${letter.solution}</div>
                ${stepsHtml}
                <div style="margin-top:8px;font-size:13px;color:var(--gold);">
                    🎁 پاداش: ${letter.reward}
                </div>
            `;
            body.appendChild(solutionDiv);

            card.appendChild(body);

            // ===== Footer =====
            const footer = document.createElement('div');
            footer.className = 'letter-footer';
            footer.innerHTML = `
                <span>📋 #${String(letter.id).padStart(2, '0')}</span>
                <span class="reward">${letter.reward}</span>
            `;
            card.appendChild(footer);

            grid.appendChild(card);
        });
    }

    // ============================================
    // فیلترها
    // ============================================
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === filter) {
                btn.classList.add('active');
            }
        });
        renderLetters();
    }

    function filterLetters() {
        renderLetters();
    }

    // ============================================
    // شروع
    // ============================================
    renderLetters();

    console.log('✉️ راهنمای کامل نامه‌های استاردو ولی - RSN');
    console.log(`📊 تعداد کل نامه‌ها: ${letterData.length}`);
</script>
