            min-height: 100vh;

            overflow-x: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;

            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #12121f, #0a0a0f);

            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

            text-align: center;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.15);
            margin-top: 4px;
        }

        .header .count {
            font-size: 12px;
            color: rgba(255,255,255,0.1);
            margin-top: 6px;
        }

        /* ===== Search ===== */

            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #fff;
            font-size: 14px;
            font-family: 'Vazirmatn', sans-serif;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.1);
        }

        .search-box input:focus {

            border-color: var(--primary);
        }

            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            justify-content: center;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
        }

        .filter-btn:hover {

            color: #fff;
        }

        .filter-btn.active {
            background: rgba(108,92,231,0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 1.2;
            this.speedY = (Math.random() - 0.5) * 1.2;
            this.color = `hsl(${Math.random() * 60 + 220}, 70%, 60%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > W) this.speedX *= -1;
            if (this.y < 0 || this.y > H) this.speedY *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 6;
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }

    // ============================================
    // متغیرهای فیلتر
    // ============================================
    let currentFilter = 'all';
    let searchQuery = '';

    // ============================================
    // رندر کردن NPCها
    // ============================================
    function renderNPCs() {
        const grid = document.getElementById('npcGrid');
        grid.innerHTML = '';

        let filtered = npcData;

        // فیلتر
        if (currentFilter !== 'all') {
            filtered = filtered.filter(n => n.source === currentFilter || n.type === currentFilter);
        }

        // جستجو
        if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(n => {
                const nameMatch = n.name.toLowerCase().includes(q);
                const giftMatch = Object.values(n.gifts).flat().some(g => g.toLowerCase().includes(q));
                return nameMatch || giftMatch;
            });
        }

        document.getElementById('npcCount').textContent = filtered.length;

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(255,255,255,0.05);">
                    <div style="font-size:48px;margin-bottom:12px;">🔍</div>
                    <div style="font-size:14px;">هیچ شخصیتی با این جستجو پیدا نشد</div>
                </div>
            `;
            return;
        }

        filtered.forEach(npc => {
            const card = document.createElement('div');
            card.className = 'npc-card';

            // Header
            const header = document.createElement('div');
            header.className = 'npc-header';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = npc.emoji;

            const info = document.createElement('div');
            info.className = 'info';

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = npc.name;

            const birthday = document.createElement('div');
            birthday.className = 'birthday';
            birthday.textContent = `🎂 ${npc.birthday}`;

            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = npc.source === 'sve' ? '🌟 SVE' : (npc.type === 'marriage' ? '💍 مجرد' : '👤');

            info.appendChild(name);
            info.appendChild(birthday);
            info.appendChild(badge);

            header.appendChild(avatar);
            header.appendChild(info);
            card.appendChild(header);

            // Gifts
            const giftSection = document.createElement('div');
            giftSection.className = 'gift-section';

            const giftTypes = [
                { key: 'love', label: '❤️ عشق', cls: 'love' },
                { key: 'like', label: '👍 دوست دارد', cls: 'like' },
                { key: 'neutral', label: '⬜ بی‌تفاوت', cls: 'neutral' },
                { key: 'dislike', label: '👎 دوست ندارد', cls: 'dislike' },
                { key: 'hate', label: '💀 متنفر', cls: 'hate' }
            ];

            giftTypes.forEach(({ key, label, cls }) => {
                const gifts = npc.gifts[key];
                if (!gifts || gifts.length === 0) return;

                const row = document.createElement('div');
                row.className = 'gift-row';

                const labelEl = document.createElement('span');
                labelEl.className = 'gift-label';
                labelEl.textContent = label;

                row.appendChild(labelEl);

                gifts.forEach(g => {
                    const tag = document.createElement('span');
                    tag.className = `gift-tag ${cls}`;
                    tag.textContent = g;
                    row.appendChild(tag);
                });

                giftSection.appendChild(row);
            });

            card.appendChild(giftSection);

            // Footer
            const footer = document.createElement('div');
            footer.className = 'npc-footer';
            footer.textContent = `📍 ${npc.source === 'sve' ? 'Stardew Valley Expanded' : 'Stardew Valley'}`;
            card.appendChild(footer);

            grid.appendChild(card);
        });
    }

    // ============================================
    // فیلترها
    // ============================================
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === filter) {
                btn.classList.add('active');
            }
        });
        renderNPCs();
    }

    function filterNPCs() {
        searchQuery = document.getElementById('searchInput').value;
        renderNPCs();
    }

    // ============================================
    // شروع
    // ============================================
    renderNPCs();
