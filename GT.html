<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چیت‌های استاردو ولی | RSN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --gold: #fdcb6e;
            --bg: #0a0a0f;
            --card: #12121f;
            --text: #e0e0e0;
            --border: rgba(255, 255, 255, 0.06);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* ===== ذرات پس‌زمینه ===== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #12121f, #0a0a0f);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== هدر ===== */
        .header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 6px;
        }

        .header .badge {
            display: inline-block;
            background: var(--gold);
            color: #0a0a0f;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
        }

        /* ===== جستجو ===== */
        .search-box {
            margin-bottom: 24px;
            position: sticky;
            top: 10px;
            z-index: 10;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.1);
        }

        /* ===== آمار ===== */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stats .stat-item {
            flex: 1;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }

        .stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }

        .stats .stat-item .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== کارت چیت ===== */
        .cheat-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cheat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.3s;
            cursor: default;
        }

        .cheat-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(108, 92, 231, 0.3);
        }

        .cheat-card .index {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            min-width: 48px;
            background: rgba(253, 203, 110, 0.08);
            padding: 4px 10px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .cheat-card .code {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: #a8a8ff;
            direction: ltr;
            text-align: left;
            word-break: break-all;
        }

        .cheat-card .reward {
            font-size: 13px;
            color: var(--gold);
            background: rgba(253, 203, 110, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
            border: 1px solid rgba(253, 203, 110, 0.1);
        }

        .cheat-card .copy-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            min-width: 56px;
        }

        .cheat-card .copy-btn:hover {
            transform: scale(1.05);
            background: #7c6df0;
        }

        .cheat-card .copy-btn:active {
            transform: scale(0.95);
        }

        .cheat-card .copy-btn.copied {
            background: #00b894;
        }

        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 40px 0 20px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }

        .footer span {
            color: var(--primary);
            font-weight: 700;
        }

        .footer .heart {
            color: #f5576c;
        }

        /* ===== پاسخ‌دهی ===== */
        @media (max-width: 600px) {
            .cheat-card {
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px 14px;
            }

            .cheat-card .code {
                font-size: 13px;
                width: 100%;
                order: 3;
                text-align: center;
            }

            .cheat-card .index {
                font-size: 12px;
                min-width: 40px;
            }

            .cheat-card .reward {
                font-size: 12px;
                padding: 2px 10px;
            }

            .cheat-card .copy-btn {
                padding: 4px 12px;
                font-size: 11px;
                min-width: 48px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats .stat-item .num {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .cheat-card .index {
                min-width: 34px;
                font-size: 10px;
                padding: 2px 6px;
            }

            .cheat-card .code {
                font-size: 11px;
            }

            .cheat-card .reward {
                font-size: 10px;
                padding: 2px 8px;
            }
        }

        /* ===== اسکرول ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = `hsl(${Math.random() * 60 + 220}, 70%, 60%)`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > W) this.speedX *= -1;
                if (this.y < 0 || this.y > H) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => { p.update();
                p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 کپی';
                copyBtn.onclick = function(e) {
                    e.stopPropagation();
                    copyToClipboard(cheat.code, copyBtn);
                };

                card.appendChild(idxSpan);
                card.appendChild(codeSpan);
                card.appendChild(rewardSpan);
                card.appendChild(copyBtn);

                // کلیک روی کارت برای کپی
                card.addEventListener('click', function() {
                    copyToClipboard(cheat.code, this.querySelector('.copy-btn'));
                });

                grid.appendChild(card);
            });

            document.getElementById('totalCount').textContent = '۷۰۰';
            document.getElementById('visibleCount').textContent = cheats.length;
        }

        // ================================================
        // کپی به کلیپ‌بورد
        // ================================================
        function copyToClipboard(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopied(btn);
                }).catch(() => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (err) {
                alert('کپی نشد! لطفاً دستی کپی کنید: ' + text);
            }
            document.body.removeChild(textarea);
        }

        function showCopied(btn) {
            const originalText = btn.textContent;
            btn.textContent = '✅ کپی';
            btn.classList.add('copied');
            copyCounter++;
            document.getElementById('copyCount').textContent = copyCounter;

            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 2000);
        }

        // ================================================
        // جستجو
        // ================================================
        function filterCheats() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('cheatGrid');

            if (query === '') {
                renderCheats(allCheats);
                return;
            }

            const filtered = allCheats.filter(cheat =>
                cheat.code.toLowerCase().includes(query) ||
                cheat.name.toLowerCase().includes(query) ||
                cheat.reward.toLowerCase().includes(query) ||
                String(cheat.id).includes(query)
            );

            renderCheats(filtered);
        }

        // ================================================
        // بارگذاری اولیه
        // ================================================
        renderCheats(allCheats);

        console.log('🎮 چیت‌های استاردو ولی - ۷۰۰ چیت');
        console.log('✨ ساخته شده توسط ریک از RSN');
        console.log(`📊 تعداد کل چیت‌ها: ${allCheats.length}`);
    </script>
